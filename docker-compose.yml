# Artifact Buckets: full deployment with Active Directory and the Windows share.
#
#   cp .env.example .env    # fill it in
#   docker compose up -d                    # web app, API, Claude Code endpoint, database, TLS
#   docker compose --profile smb up -d      # plus the domain-joined Windows share
#
# The folder tree lives on the host at ${AB_POOL} (a mergerfs pool of the disks under ${AB_VOLUMES}).
# See README.md for the host setup.

name: artifact-buckets

services:
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports: ["443:443", "80:80"]
    environment:
      AB_HOSTNAME: ${AB_HOSTNAME}
      AB_TLS_MODE: ${AB_TLS_MODE:-internal}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${AB_TLS_DIR:-./deploy/caddy/certs}:/certs:ro
      - caddy-data:/data
    depends_on: [app]

  app:
    build: .
    image: artifact-buckets/app:0.1.0
    restart: unless-stopped
    env_file: .env
    environment:
      AB_BASE_URL: https://${AB_HOSTNAME}
      AB_DATABASE_URL: postgresql+psycopg://buckets:${POSTGRES_PASSWORD}@db:5432/buckets
      AB_SECURE_COOKIES: "true"
      AB_TREE_ROOT: /data/tree
      AB_VOLUMES_ROOT: /data/volumes
      AB_VOLUMES_HOST_ROOT: ${AB_VOLUMES}
    volumes:
      - ${AB_POOL}:/data/tree
      - ${AB_VOLUMES}:/data/volumes
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db: { condition: service_healthy }

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: buckets
      POSTGRES_DB: buckets
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buckets"]
      interval: 5s
      retries: 20

  samba:
    profiles: [smb]
    build: ./deploy/samba
    image: artifact-buckets/samba:0.1.0
    restart: unless-stopped
    hostname: ${AB_SMB_NETBIOS:-BUCKETS}
    network_mode: host          # SMB on 445 straight on the host's address; registers in DNS as the host name
    environment:
      AD_REALM: ${AB_AD_REALM}
      AD_WORKGROUP: ${AB_AD_WORKGROUP}
      AB_IDMAP_BASE: ${AB_IDMAP_BASE:-100000}
      SMB_NETBIOS: ${AB_SMB_NETBIOS:-BUCKETS}
    secrets: [ad_join_user, ad_join_password]
    volumes:
      - ${AB_POOL}:/srv/tree
      - samba-state:/var/lib/samba
      - samba-logs:/var/log/samba    # per-operation audit lines for a SIEM forwarder
    cap_add: [SYS_ADMIN]       # needed for ACL and xattr handling on the share

volumes:
  caddy-data:
  db-data:
  samba-state:
  samba-logs:

secrets:
  ad_join_user:
    file: ./secrets/ad_join_user
  ad_join_password:
    file: ./secrets/ad_join_password
